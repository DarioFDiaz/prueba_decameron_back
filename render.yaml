databases:
  - name: hoteles-db
    plan: free
    databaseName: hoteles
    user: hoteles

services:
  - type: web
    name: hoteles-api
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SCHEMA
        value: public
      - key: DB_URL
        fromDatabase:
          name: hoteles-db
          property: connectionString
